name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project & docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 1：リンク先が存在しない場合はすべてエラー（索引の「予定」も認めない）
      LINK_CHECK_STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Tools/CI/package-lock.json

      - name: Check for committed secrets
        run: python Tools/CI/check_secrets.py

      - name: Check Unreal project file
        run: python Tools/CI/check_project.py

      - name: Check Markdown links
        run: python Tools/CI/check_links.py

      - name: Run Python unit tests (Tools/*/tests)
        shell: bash
        run: |
          set -euo pipefail
          for dir in Tools/*/tests; do
            echo "::group::$dir"
            python -I -m unittest discover -s "$dir" -p "test_*.py" -v
            echo "::endgroup::"
          done

      - name: Install CI tools (npm ci, locked)
        run: npm ci --prefix Tools/CI --no-audit --no-fund

      - name: Check Mermaid diagrams render
        run: node Tools/CI/check_mermaid.mjs
